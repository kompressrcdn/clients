name: Prepare MCP release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'kompressrcdn/clients' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm --prefix sdk-js ci --ignore-scripts
      - run: node scripts/verify.mjs
      - run: node scripts/build-mcp-release.mjs "$RUNNER_TEMP/kompressr-mcp-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mcp-release-preview-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kompressr-mcp-release/*
          if-no-files-found: error
          retention-days: 7
