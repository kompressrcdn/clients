name: Verify clients
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: select
        run: python scripts/release/changes.py "$RUNNER_TEMP/selection.json"
      - name: Check shared source, contracts and metadata
        run: |
          node --test scripts/public-content.test.mjs scripts/distribution.test.mjs scripts/mcp-release-metadata.test.mjs scripts/skill-examples.test.mjs
          node scripts/check-public-content.mjs
          node scripts/verify-contract.mjs
          node scripts/verify-mcp-metadata.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name == 'push'
        with:
          name: client-selection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/selection.json
          if-no-files-found: error
          retention-days: 30
  verify:
    needs: [changes]
    if: contains(fromJSON(needs.changes.outputs.packages), 'sdk-js') || contains(fromJSON(needs.changes.outputs.packages), 'mcp-server')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.0.0', '22', '23', '24', '25', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            sdk-js/package-lock.json
            mcp-server/package-lock.json
      # Install development tools with their supported Node version, then run
      # the complete test and installed-consumer suites on the target runtime.
      - run: npm --prefix sdk-js ci --ignore-scripts
      - if: contains(fromJSON(needs.changes.outputs.packages), 'mcp-server')
        run: npm --prefix mcp-server run install:local-sdk
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - if: contains(fromJSON(needs.changes.outputs.packages), 'sdk-js')
        run: npm --prefix sdk-js run verify
      - if: contains(fromJSON(needs.changes.outputs.packages), 'mcp-server')
        run: npm --prefix mcp-server run verify
  python:
    needs: [changes]
    if: contains(fromJSON(needs.changes.outputs.packages), 'python')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e './sdk-python[dev]'
      - run: node scripts/verify-all.mjs python
  go:
    needs: [changes]
    if: contains(fromJSON(needs.changes.outputs.packages), 'go')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24.x', '1.25.x', '1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: node scripts/verify-all.mjs go
        env:
          GOTOOLCHAIN: local
  java:
    needs: [changes]
    if: contains(fromJSON(needs.changes.outputs.packages), 'java')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: sdk-java/pom.xml
      - run: node scripts/verify-all.mjs java
  dotnet:
    needs: [changes]
    if: contains(fromJSON(needs.changes.outputs.packages), 'dotnet')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: '8.0.x'
            framework: net8.0
          - sdk: '10.0.x'
            framework: net10.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.sdk }}
      - run: node scripts/verify-all.mjs dotnet
        env:
          KOMPRESSR_TEST_FRAMEWORK: ${{ matrix.framework }}
  php:
    needs: [changes]
    if: contains(fromJSON(needs.changes.outputs.packages), 'php')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
          tools: composer:v2
          coverage: none
      - run: node scripts/verify-all.mjs php
  ruby:
    needs: [changes]
    if: contains(fromJSON(needs.changes.outputs.packages), 'ruby')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: sdk-ruby
          bundler-cache: true
      - run: node scripts/verify-all.mjs ruby

  release-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s scripts/release -p 'test_*.py' -v
      - run: python scripts/release/release.py versions

  release-gate:
    if: always()
    needs: [changes, verify, python, go, java, dotnet, php, ruby, release-tools]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require selected checks and deliberate skips
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
          EXPECTED_PACKAGES: ${{ needs.changes.outputs.packages }}
        run: python3 scripts/release/gate.py
